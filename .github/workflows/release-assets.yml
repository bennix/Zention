name: Release assets

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Actions run that already built the Linux and Windows installers
        required: true
        type: string
      tag:
        description: Existing release tag
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download the built installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.run_id }}" --repo "${{ github.repository }}" --dir dist
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.exe' \) | sort)
          test "${#files[@]}" -gt 0
          printf '%s\n' "${files[@]}"
          gh release upload "${{ inputs.tag }}" "${files[@]}" --repo "${{ github.repository }}" --clobber
